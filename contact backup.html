<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - HR Services</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0f2fe;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      color: #1e40af;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }

    .form-container, .info-container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 300px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #1e40af;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }

    .info-container p {
      margin-bottom: 10px;
    }

    .map-container {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      margin-top: 20px;
      overflow: hidden;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .map-placeholder {
      width: 100%;
      height: 100%;
      background-color: #cbd5e1;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      font-style: italic;
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <section>
    <h1>Contact Us</h1>

    <div class="container">
      <!-- Contact Form -->
      <div class="form-container">
        <form action="#" method="POST">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>

      <!-- Contact Info -->
      <div class="info-container">
        <h2 style="color:#1e40af;">Get in Touch</h2>
        <p>Looking to hire, partner, or ask a question? We’re here to help.</p>
        <p><strong>Phone:</strong> <a href="tel:+919665944274">+91 9665944274</a></p>
        <p><strong>Email:</strong> <a href="mailto:helpyourself@gmail.com">helpyourself@gmail.com</a></p>
        <p><strong>Address:</strong><br/>Velapur, Maharashtra<br/>India</p>

        <!-- Google Map / Offline Message -->
        <div class="map-container" id="mapArea">
          <!-- Content injected by JavaScript -->
        </div>
      </div>
    </div>
  </section>

  <script>
    function loadMapOrMessage() {
      const mapArea = document.getElementById('mapArea');
      if (navigator.onLine) {
        mapArea.innerHTML = `
          <iframe 
            src="https://www.google.com/maps?q=Velapur,+Maharashtra,+India&output=embed" 
            allowfullscreen="" 
            loading="lazy">
          </iframe>`;
      } else {
        mapArea.innerHTML = `
          <div class="map-placeholder">
            Map not available. Please check your internet connection.
          </div>`;
      }
    }

    // Initial check
    loadMapOrMessage();

    // Listen for changes in connectivity
    window.addEventListener('online', loadMapOrMessage);
    window.addEventListener('offline', loadMapOrMessage);
  </script>

</body>
</html>
